{% assign featured = site.data.publist | where: 'highlight', 1 | first %}
{% if featured %}
{% assign publication_id = featured.title | slugify | prepend: 'publication-' %}
<article class="classic-featured-publication">
  <div class="classic-panel-heading">
    <h2>Publications</h2>
    <a href="{{ '/publications/' | relative_url }}">Archive</a>
  </div>
  <a class="classic-featured-publication__image" href="{{ '/publications/#' | append: publication_id | relative_url }}">
    <img src="{{ '/images/pubpic/' | append: featured.image | relative_url }}" alt="Preview of {{ featured.title | escape }}">
  </a>
  <p>{{ featured.venue }} · {{ featured.year }}</p>
  <h3><a href="{{ '/publications/#' | append: publication_id | relative_url }}">{{ featured.title }}</a></h3>
</article>
{% endif %}
