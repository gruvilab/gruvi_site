<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  {% capture meta_description %}{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines }}{% else %}{{ site.description | strip_html | strip_newlines }}{% endif %}{% endcapture %}
  <meta name="description" content="{{ meta_description | truncate: 160 | escape }}">
  <meta name="theme-color" content="#060a13">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ meta_description | truncate: 160 | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/logopic/gruvi-mark.svg' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/gruvi-favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/gruvi-favicon.png' | relative_url }}">
  {% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}
</head>
