<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="GrUVi home">
      {% include logo-mark.html %}
      <span class="brand__word" aria-hidden="true">gr<span>u</span>vi</span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/people/' | relative_url }}"{% if page.url contains '/people' %} class="is-active" aria-current="page"{% endif %}>People</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} class="is-active" aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/news/' | relative_url }}"{% if page.url contains '/news' %} class="is-active" aria-current="page"{% endif %}>News</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="is-active" aria-current="page"{% endif %}>About</a>
    </nav>

    <details class="mobile-nav">
      <summary aria-label="Open navigation"><span></span><span></span></summary>
      <nav aria-label="Mobile navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/people/' | relative_url }}">People</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/news/' | relative_url }}">News</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </details>
  </div>
</header>
